syntax = "proto3";
package grpc;
option go_package = "replicated_auction/grpc/private";

message EchoRequest {} // echo is just testing if alive, keep-alive pings
message EchoResponse {} // therefore lamport time might cause deadlocks if used.

message HiIExistRequest {
    uint32 id = 1;
    string port = 2;
    uint64 timestamp = 3;
}
message HiIExistResponse {
    message Servers {
        uint32 id = 1;
        string port = 2;
    }
    repeated Servers servers = 1;
    uint64 timestamp = 2;
    uint32 my_id = 3;
}

message CallElectionRequest {
    uint32 my_id = 1;
    uint64 timestamp = 2;
}
message CallElectionResponse {
    optional uint32 leader_id = 1;
    uint64 timestamp = 2;
}
message IAmLeaderRequest {
    uint32 my_id = 1;
    uint64 timestamp = 2;
}
message IAmLeaderResponse {
    uint64 timestamp = 1;
}

message DataUpdatedRequest {
    uint32 bidder_id = 1;
    uint32 bid = 2;
    uint32 end_unixtime = 3;
    uint64 timestamp = 4;
}
message DataUpdatedResponse {
    uint64 timestamp = 1;
}

service LeaderService {
    rpc Echo(EchoRequest) returns (EchoResponse);

    rpc HiIExist(HiIExistRequest) returns (HiIExistResponse);
    rpc CallElection(CallElectionRequest) returns (CallElectionResponse);
    rpc IAmLeader(IAmLeaderRequest) returns (IAmLeaderResponse);

    rpc DataUpdated(DataUpdatedRequest) returns (DataUpdatedResponse);
}
